name: Build BunkClub Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build Web Frontend & Sync Capacitor
        run: |
          cd frontend
          npm install
          npm run build
          npx cap sync android

      - name: Build Native Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload BunkClub APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkClub-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
