name: Keep Alive 24/7

on:
  schedule:
    # Runs every 10 minutes indefinitely in GitHub Cloud
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BunkClub Backend & Frontend to Prevent Render Spin Down
        run: |
          echo "Pinging BunkClub Backend..."
          curl -s -f https://bunkwell-backend.onrender.com/api/health || true
          echo "Pinging BunkClub Frontend..."
          curl -s -f https://bunkwell.onrender.com || true
          echo "Keep-alive ping completed at $(date)"
